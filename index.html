<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Étude col fémoral</title>
<meta name="description" content="Fiche d'exploitation de l'étude prospective sur les fractures du col fémoral traitées par arthroplastie.">
<meta name="theme-color" content="#0B6E75">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Étude col">
<style>
:root{
  --ink:#14323A; --muted:#566D73; --paper:#F3F6F6; --surface:#FFFFFF; --line:#C9D6D8;
  --accent:#0B6E75; --accent-soft:#DCEFEF; --warn:#8A5200; --warn-soft:#FFF4DF;
  --err:#B3261E; --err-soft:#FCEDEB; --ok:#1F7A4D; --ok-soft:#E2F3EA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.top b{font-size:1rem}
.top small{display:block;opacity:.8}
.link{background:none;border:0;padding:6px;color:inherit;text-decoration:underline;cursor:pointer}
.btn{min-height:46px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--surface);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;min-height:56px;font-size:1.05rem}
.btn:disabled{opacity:.55;cursor:wait}

/* Connexion */
.login{max-width:420px;margin:8vh auto 0;padding:16px}
.login h1{margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 20px}
.login input{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}

/* Accueil */
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
.sec>p{margin:0 0 10px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.item{display:flex;width:100%;gap:12px;justify-content:space-between;align-items:center;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--paper)}
.item strong{display:block}
.item small{color:var(--muted)}
.tag{flex:none;font-size:.82rem;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--paper);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.search{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px}
.empty{padding:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}

/* Fiche patient : frise de suivi */
.back{margin:0 0 10px;padding:6px 0;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px}
.facts span{display:block;font-size:.85rem;color:var(--muted)}
.rail{list-style:none;margin:0;padding:0;position:relative}
.rail::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:3px;background:var(--line)}
.rail li{position:relative;padding:10px 0 10px 38px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rail .dot{position:absolute;left:3px;top:50%;margin-top:-10px;width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rail .fait .dot{background:var(--ok);border-color:var(--ok)}
.rail .retard .dot{border-color:var(--err);background:var(--err-soft)}
.rail .afaire .dot{border-color:var(--accent);background:var(--accent-soft)}
.rail .op .dot{background:var(--ink);border-color:var(--ink)}
.rail strong{display:block}
.rail small{color:var(--muted)}
.rail .btn{min-height:40px;padding:6px 14px}

/* Formulaire */
.formhead{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff}
.formhead .wrap{padding-top:10px;padding-bottom:0}
.formhead .who{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.steps{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;min-height:38px;padding:5px 11px;border-radius:6px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:.9rem;cursor:pointer}
.steps button[aria-current=step]{background:#fff;color:var(--ink);font-weight:700}
.steps i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:transparent;border:1.5px solid currentColor;vertical-align:baseline}
.steps .done i{background:#5FD39A;border-color:#5FD39A}
.steptitle{margin:6px 0 4px}
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
@media (min-width:720px){.q{grid-template-columns:230px minmax(0,1fr);gap:16px}}
.q>.lab{font-weight:600}
.q .req{color:var(--err);font-weight:700}
.q .hint{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:3px}
.q.strong>.lab{color:var(--accent)}
.q input[type=text],.q input[type=tel],.q input[type=number],.q input[type=date],.q input[type=time],.q select,.q textarea{width:100%;max-width:360px;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.q textarea{max-width:none;min-height:110px}
.withunit{display:flex;align-items:center;gap:8px;max-width:360px}
.withunit span{color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.chips.e4{grid-template-columns:repeat(4,minmax(0,1fr))}.chips.e5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.chip{position:relative;display:block;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:flex;align-items:center;justify-content:center;text-align:center;height:100%;min-height:44px;min-width:48px;padding:8px 13px;border:1.5px solid var(--line);border-radius:8px;background:#fff;line-height:1.25}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chip.multi span::before{content:"";flex:none;width:15px;height:15px;margin-right:8px;border:1.5px solid currentColor;border-radius:3px}
.chip.multi input:checked+span::before{background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink)}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:520px}
.scale .chip span{min-width:0;padding:8px 0}
.calc{display:flex;align-items:baseline;gap:6px;min-height:30px;font-weight:700;font-size:1.1rem;color:var(--accent)}
.calc.none{font-weight:400;font-size:.92rem;color:var(--muted)}
.head{padding:22px 0 4px;border-bottom:2px solid var(--ink)}
.head h3{font-size:1.02rem}
.head p{margin:3px 0 6px;font-size:.88rem;color:var(--muted)}
.note{margin:12px 0 0;padding:10px 12px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.ferr{margin-top:6px;color:var(--err);font-size:.9rem;font-weight:600}
.block{margin-top:14px;padding:12px;border-radius:8px;background:var(--err-soft);color:var(--err);font-weight:600}
.reh{border:1.5px solid var(--line);border-radius:8px;padding:0 12px 12px;margin-bottom:12px;background:var(--surface)}
.reh>header{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.reh .q{grid-template-columns:minmax(0,1fr);gap:6px}
.bar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px}
.bar .btn{flex:1 1 0;max-width:220px}
.bar .state{flex:1 1 0;text-align:center;font-size:.85rem;color:var(--muted)}
.recap{margin-top:14px}
.recap .list{margin-top:10px}
.proto{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px}
.proto h3{margin:0 0 6px}
.proto textarea{display:block;width:100%;min-height:320px;margin:10px 0 12px;padding:12px;font:15px/1.55 Georgia,"Times New Roman",serif;color:var(--ink);background:#FCFDFD;border:1px solid var(--line);border-radius:8px;resize:vertical}
.ban{padding:14px;border-radius:8px;font-weight:600}
.ban.ok{background:var(--ok-soft);color:var(--ok)}
.ban.warn{background:var(--warn-soft);color:var(--warn)}
details.fig{margin-top:10px}
details.fig summary{display:inline-block;min-height:40px;padding:8px 0;color:var(--accent);font-weight:600;cursor:pointer}
details.fig svg{display:block;width:100%;max-width:560px;height:auto;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.fig svg.narrow{max-width:420px}
details.fig img.figimg{display:block;width:100%;max-width:520px;height:auto;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff}
details.fig img.figimg.wide{max-width:640px}
details.fig .cortex{fill:#A9C2C8;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
details.fig .cortex.nostroke{stroke:none}
details.fig .spongy{fill:#EEF4F5}
details.fig .canal{fill:#FAFCFC}
details.fig .tr{fill:none;stroke-width:2.6;stroke-linecap:round}
details.fig .tc{stroke:#0B6E75}
details.fig .tt{stroke:#C27A12}
details.fig .tr.sec{opacity:.55;stroke-width:2}
details.fig .tr.thin{stroke-width:1.5}
details.fig .tg{stroke:#7C9196;stroke-width:1.8}
details.fig .tw{stroke:#A9BCC0;stroke-width:1.3}
details.fig .dash{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
details.fig .dim{stroke:var(--ink);stroke-width:1.4}
details.fig .dim.d{stroke:#0B6E75;stroke-width:2.4}
details.fig .dim.c{stroke:var(--err);stroke-width:2.4}
details.fig text{font:600 15px "Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink);text-anchor:middle}
details.fig text.g{font-size:22px;font-weight:700}
details.fig text.c{font-weight:400;font-size:15px;fill:var(--muted)}
details.fig text.td{fill:#0B6E75}
details.fig text.tcn{fill:var(--err)}
.figcap{margin:8px 0 0;font-size:.9rem;color:var(--muted);max-width:640px}
.files .list{margin-bottom:10px}
.upl{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upl.busy{opacity:.6;pointer-events:none}
.uplrow{display:flex;flex-wrap:wrap;gap:10px}
.uplrow .upl{flex:1 1 160px;justify-content:center}
.upl-state{margin:8px 0 0;color:var(--muted);font-size:.92rem}
.xray{display:block;max-width:100%;max-height:70vh;margin:0 auto 12px;background:#000}
.modal>div:has(.xray){max-width:900px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;max-width:92vw;padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}
#toast.bad{background:var(--err)}
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,50,58,.55)}
.modal>div{width:100%;max-width:440px;padding:18px;border-radius:10px;background:#fff}
.modal p{margin:0 0 14px}
.modal input{width:100%;min-height:48px;padding:9px 12px;margin-bottom:12px;border:1.5px solid var(--line);border-radius:8px;text-transform:uppercase}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.chip span{transition:background-color .12s}}
</style>
</head>

<div id="modal" hidden></div>

  const P = S.patient, v = P.values, t = S.home ? S.home.today : today();
  const summary = { sortie: v.sortie, date_sortie: v.date_sortie, visits: P.visits, date_interv: v.date_interv };
  const vit = vital_(summary), alive = vit.etat === 'Vivant';
  const cal = calendar_(v.date_interv, P.visits, SCHEMA.visits, t);
  const other = P.visits.filter(x => x.visite === 'Autre');
  const tel = (n, l) => n ? `<div><span>${esc(l)}</span><a href="tel:${esc(String(n).replace(/[ .\-]/g, ''))}">${esc(n)}</a></div>` : '';
  $app.innerHTML = topBar() + `<main class="wrap">
    <button class="link back" onclick="viewHome()">Retour à l'accueil</button>
    <h1>${esc(v.nom)}</h1>
    <div class="facts">
      <div><span>N° d'inclusion</span>${esc(P.id)}</div>
      <div><span>N° de dossier</span>${esc(v.n_dossier)}</div>
      ${tel(v.tel_patient, 'Téléphone du patient')}
      ${tel(v.tel_proche, 'Proche' + (v.lien_proche ? ' (' + v.lien_proche + ')' : ''))}
      ${v.contact2 ? `<div><span>2e contact</span>${esc(v.contact2)}</div>` : ''}
      <div><span>Prothèse</span>${esc(v.type_arthro || 'Non renseignée')}</div>
      <div><span>Statut</span>${esc(vit.etat)}${vit.date ? ' (' + frDate(vit.date) + ')' : ''}</div>
    </div>
    <p class="uplrow" style="margin-top:12px"><button class="btn" onclick="openInclusion('${esc(P.id)}')">Ouvrir la fiche d'inclusion</button>
      <button class="btn" onclick="viewProtocol('${esc(P.id)}')">Protocole opératoire</button></p>
    <section class="sec"><h2>Frise de suivi</h2>
    ${!v.date_interv ? '<div class="empty">Le calendrier apparaîtra dès que la date de l\'intervention sera saisie dans la fiche d\'inclusion.</div>' : `
      ${!alive ? `<div class="note" style="margin-bottom:10px">Patient ${esc(vit.etat.toLowerCase())} : plus aucune visite n'est attendue.</div>` : ''}
      <ol class="rail"><li class="op"><i class="dot"></i><span><strong>Intervention</strong><small>${frDate(v.date_interv)}</small></span></li>
      ${cal.map(c => {
        const lab = c.done ? `réalisée le ${frDate(c.done.date_visite)} (${c.done.mode === 'Téléphone' ? 'téléphone' : c.done.statut === 'Vivant' ? 'consultation' : c.done.statut.toLowerCase()})` : `prévue le ${frDate(c.due)}`;
        const cls = c.done ? 'fait' : alive ? c.state : '';
        const action = c.done
          ? `<button class="btn" onclick="openVisit('${esc(P.id)}','${esc(c.done.visite_id)}')">Ouvrir</button>`
          : alive && (c.state === 'retard' || c.state === 'afaire') ? `<button class="btn pri" onclick="newVisit('${esc(c.visite)}')">Saisir la visite</button>` : '';
        const tag = !c.done && alive && c.state === 'retard' ? ' <span class="tag err">En retard</span>' : '';
        return `<li class="${cls}"><i class="dot"></i><span><strong>${esc(c.visite)}${tag}</strong><small>${lab}</small></span>${action}</li>`;
      }).join('')}</ol>
      ${other.length ? `<h3 style="margin-top:14px">Visites hors calendrier</h3><div class="list" style="margin-top:8px">${other.map(x => `<button class="item" onclick="openVisit('${esc(P.id)}','${esc(x.visite_id)}')"><span><strong>${esc(x.visite_txt || 'Autre')}</strong><small>${frDate(x.date_visite)}</small></span></button>`).join('')}</div>` : ''}
      <p><button class="btn" onclick="newVisit('')">Saisir une autre visite</button></p>`}
    </section></main>`;
}

/* ---------- Moteur de formulaire ---------- */
/** Propose de reprendre la saisie gardée sur le téléphone pour cette fiche (auto : sans demander). */
async function offerDraft(F, auto) {
  const k = drafts.key(F), d = drafts.get(k);
  if (!d) return;
  if (!F.isNew && d.version !== F.version) {
    drafts.del(k);
    toast('Une saisie ancienne gardée sur ce téléphone a été écartée : la fiche a été modifiée depuis.', true);
    return;
  }
  if (!auto) {
    const a = await dialog(`<p>Une saisie non enregistrée du ${esc(frStamp(d.t))} a été retrouvée sur ce téléphone : <b>${esc(d.label)}</b>.</p>`, [{ l: 'L\'effacer' }, { l: 'La reprendre', pri: 1 }]);
    if (a.i !== 1) { drafts.del(k); return; }
  }
  F.v = d.v; F.dirty = true;
  F.step = Math.max(0, Math.min(d.step || 0, stepsOf(F).length - 1));
}
async function openDraft(k) {
  const d = drafts.get(k);
  if (!d) { renderHome(); return; }
  if (d.kind === 'inclusion') return d.id ? openInclusion(d.id, true) : startInclusion(true);
  if (d.visiteId) return openVisit(d.id, d.visiteId, true);
  loading('Chargement du patient…');
  try { S.patient = await api('getPatient', d.id); newVisit(d.v.visite, true); } catch (e) { fail(e); }
}
async function startInclusion(auto) {
  S.form = { kind: 'inclusion', def: SCHEMA.inclusion, v: { date_inclusion: today() }, ctx: { today: today() }, id: null, version: 0, step: 0, dirty: false, isNew: true };
  await offerDraft(S.form, auto);
  renderForm();
}
async function openInclusion(id, auto) {
  loading('Ouverture de la fiche…');
  try {
    const P = await api('getPatient', id);
    S.patient = P;
    S.form = { kind: 'inclusion', def: SCHEMA.inclusion, v: P.values, ctx: { today: today() }, id, version: P.version, step: 1, dirty: false, isNew: false };
    await offerDraft(S.form, auto);
    renderForm();
  } catch (e) { fail(e); }
}
function suiviCtx() {
  const v = S.patient.values;
  return { today: today(), date_interv: v.date_interv, groupe_arthro: v.groupe_arthro };
}
async function newVisit(k, auto) {
  S.form = { kind: 'suivi', def: SCHEMA.suivi, v: { visite: k || 'Autre', date_visite: today() }, ctx: suiviCtx(), id: S.patient.id, visiteId: null, version: 0, step: 0, dirty: true, isNew: true };
  await offerDraft(S.form, auto);
  renderForm();
}
async function openVisit(pid, vid, auto) {
  loading('Ouverture de la visite…');
  try {
    if (!S.patient || S.patient.id !== pid) S.patient = await api('getPatient', pid);
    const V = await api('getVisit', vid);
    S.form = { kind: 'suivi', def: SCHEMA.suivi, v: V.values, ctx: suiviCtx(), id: pid, visiteId: vid, version: V.version, step: 0, dirty: false, isNew: false };
    await offerDraft(S.form, auto);
    renderForm();
  } catch (e) { fail(e); }
}

const RECAP = { id: '_recap', title: 'Vérification', short: 'Vérification', fields: [] };
function stepsOf(F) {
  const st = F.def.steps.filter(s => cond_(s.show, F.v));
  return st.concat([RECAP]);
}
function fieldHtml(f, v, prefix) {
  prefix = prefix || '';
  if (f.t === 'note') return `<p class="note">${esc(f.text)}</p>`;
  if (f.t === 'head') return `<div class="head"><h3>${esc(f.label)}</h3>${f.hint ? `<p>${esc(f.hint)}</p>` : ''}${figHtml(f.fig)}</div>`;
  if (f.hidden) return '';
  const name = prefix + f.id, val = v[f.id];
  const req = f.req ? ' <span class="req" title="Obligatoire">*</span>' : '';
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  let ctl = '', labelFor = `<div class="lab">${esc(f.label)}${req}${hint}</div>`;
  if (f.t === 'radio') {
    const even = f.even ? `even e${f.even}` : '';
    ctl = `<div class="chips ${even}" role="radiogroup" aria-label="${esc(f.label)}">${f.opts.map(o => `<label class="chip"><input type="radio" name="${esc(name)}" value="${esc(o.v)}" ${String(val) === String(o.v) ? 'checked data-was="1"' : ''}><span>${esc(o.l)}</span></label>`).join('')}</div>`;
  } else if (f.t === 'multi') {
    ctl = `<div class="chips" role="group" aria-label="${esc(f.label)}">${f.opts.map(o => `<label class="chip multi"><input type="checkbox" name="${esc(name)}" value="${esc(o.k)}" ${(val || []).indexOf(o.k) >= 0 ? 'checked' : ''}><span>${esc(o.l)}</span></label>`).join('')}</div>`;
  } else if (f.t === 'scale') {
    const r = []; for (let i = f.min; i <= f.max; i++) r.push(i);
    ctl = `<div class="scale" role="radiogroup" aria-label="${esc(f.label)}">${r.map(i => `<label class="chip"><input type="radio" name="${esc(name)}" value="${i}" ${String(val) === String(i) ? 'checked data-was="1"' : ''}><span>${i}</span></label>`).join('')}</div>`;
  } else if (f.t === 'select') {
    ctl = `<select name="${esc(name)}" aria-label="${esc(f.label)}"><option value="">Choisir…</option>${f.opts.map(o => `<option value="${esc(o.v)}" ${String(val) === String(o.v) ? 'selected' : ''}>${esc(o.l || o.v)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    ctl = `<textarea name="${esc(name)}" aria-label="${esc(f.label)}">${esc(val)}</textarea>`;
  } else if (f.t === 'calc') {
    ctl = `<div class="calc" data-calc="${esc(f.id)}"></div>`;
  } else if (f.t === 'repeat') {
    ctl = `<div data-repeat="${esc(f.id)}"></div>`;
  } else if (f.t === 'files') {
    ctl = `<div class="files" data-files="${esc(f.id)}"></div>`;
  } else {
    const type = { number: 'number', date: 'date', time: 'time', tel: 'tel', text: 'text' }[f.t];
    const inp = `<input type="${type}" name="${esc(name)}" aria-label="${esc(f.label)}" value="${esc(val)}" ${f.t === 'number' ? 'inputmode="decimal" step="any"' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} autocomplete="off">`;
    ctl = f.unit ? `<div class="withunit">${inp}<span>${esc(f.unit)}</span></div>` : inp;
  }
  return `<div class="q ${f.strong ? 'strong' : ''}" data-f="${esc(name)}">${labelFor}<div>${ctl}<div class="ferr" data-err="${esc(name)}" hidden></div>${figHtml(f.fig)}</div></div>`;
}

function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Format non lu : envoyez une photo JPEG ou PNG.')); };
    img.src = url;
  });
}
function renderFiles() {
  const F = S.form;
  document.querySelectorAll('[data-files]').forEach(box => {
    const id = box.dataset.files, list = F.v[id] || [];
    box.innerHTML = (list.length ? `<div class="list">${list.map((fid, i) => `<div class="item"><span><strong>Radiographie ${i + 1}</strong></span>
        <span><button type="button" class="link" data-see="${esc(fid)}">Voir</button> <button type="button" class="link" data-rm="${i}">Retirer</button></span></div>`).join('')}</div>` : '')
      + (F.id ? `<div class="uplrow"><label class="btn pri upl"><span>Prendre une photo</span><input type="file" accept="image/*" capture="environment" aria-label="Prendre une photo de la radiographie"></label>
                 <label class="btn upl"><span>${list.length ? 'Ajouter une autre image' : 'Choisir une image'}</span><input type="file" accept="image/*" aria-label="Choisir une image de la radiographie"></label></div>
                 <p class="upl-state" hidden></p>`
              : '<p class="note">Enregistrez d\'abord l\'identité du patient pour pouvoir joindre une image.</p>');
    box.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      box.querySelectorAll('.upl').forEach(l => l.classList.add('busy'));
      const st = box.querySelector('.upl-state'); st.hidden = false; st.textContent = 'Envoi de l\'image en cours…';
      try {
        const data = await compressImage(file);
        const r = await api('uploadImage', F.id, id, data);
        F.v[id] = (F.v[id] || []).concat([r.id]); F.dirty = true;
        await save();
        toast('Radiographie enregistrée');
      } catch (e) { toast('Image non enregistrée : ' + (e.message || 'vérifiez la connexion'), true); }
      renderFiles(); refresh();
    });
    box.querySelectorAll('[data-see]').forEach(b => b.onclick = async () => {
      b.textContent = 'Chargement…';
      try { const src = await api('getImage', b.dataset.see); await dialog(`<img src="${src}" alt="Radiographie" class="xray">`, [{ l: 'Fermer', pri: 1 }]); }
      catch (e) { toast('Image introuvable : ' + e.message, true); }
      b.textContent = 'Voir';
    });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      const a = await dialog('<p>Retirer cette radiographie de la fiche ? Elle sera placée dans la corbeille de votre Google Drive.</p>', [{ l: 'Annuler' }, { l: 'Retirer', pri: 1 }]);
      if (a.i !== 1) return;
      const fid = F.v[id][Number(b.dataset.rm)];
      F.v[id] = F.v[id].filter(x => x !== fid); if (!F.v[id].length) delete F.v[id];
      F.dirty = true;
      if (await save()) { try { await api('removeImage', fid); } catch (e) {} }
      renderFiles(); refresh();
    });
  });
}

function renderForm() {
  const F = S.form, steps = stepsOf(F);
  if (F.step >= steps.length) F.step = steps.length - 1;
  const step = steps[F.step];
  compute_(F.kind, F.v, F.ctx);
  const titleL = F.kind === 'inclusion' ? (F.v.nom || 'Nouveau patient') : S.patient.values.nom;
  const titleR = F.kind === 'inclusion' ? (F.id || 'Partie A : inclusion') : (S.patient.id + ', suivi');
  $app.innerHTML = `<div class="formhead"><div class="wrap">
      <div class="who"><b>${esc(titleL)}</b><button class="link" id="fq">Quitter</button></div>
      <small>${esc(titleR)}</small>
      <nav class="steps" id="st" aria-label="Étapes"></nav></div></div>
    <main class="wrap" id="fm"><h2 class="steptitle">${esc(step.title)}</h2>
      ${step === RECAP ? '<div id="recap" class="recap"></div>' : step.fields.map(f => fieldHtml(f, F.v)).join('')}
      <div id="blocker"></div></main>
    <div class="bar"><div class="wrap">
      <button class="btn" id="bp" ${F.step === 0 ? 'hidden' : ''}>Précédent</button>
      <span class="state" id="fs"></span>
      <button class="btn pri" id="bn">${step === RECAP ? 'Terminer' : 'Suivant'}</button>
    </div></div>`;
  document.getElementById('fq').onclick = quitForm;
  document.getElementById('bp').onclick = () => go(F.step - 1);
  document.getElementById('bn').onclick = () => step === RECAP ? finish() : go(F.step + 1);
  const fm = document.getElementById('fm');
  fm.addEventListener('input', onInput);
  fm.addEventListener('click', onChipClick);
  if (step.fields.some(f => f.t === 'repeat')) renderRepeat();
  if (step.fields.some(f => f.t === 'files')) renderFiles();
  refresh();
  window.scrollTo(0, 0);
  const cur = document.querySelector('.steps [aria-current]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function currentStep() { const F = S.form; return stepsOf(F)[F.step]; }

function onChipClick(e) {
  const i = e.target;
  if (i.tagName !== 'INPUT' || i.type !== 'radio') return;
  /* Toucher une réponse déjà cochée l'efface. */
  if (i.dataset.was === '1') { i.checked = false; i.dataset.was = ''; setVal(i, ''); }
  else { document.getElementsByName(i.name).forEach(x => x.dataset.was = ''); i.dataset.was = '1'; }
}
function onInput(e) {
  const i = e.target;
  if (!i.name) return;
  if (i.type === 'checkbox') {
    const fld = fieldByName(i.name);
    let a = Array.from(document.getElementsByName(i.name)).filter(x => x.checked).map(x => x.value);
    if (fld && fld.exclusive) {
      if (i.value === fld.exclusive && i.checked) a = [fld.exclusive];
      else if (i.checked) a = a.filter(k => k !== fld.exclusive);
      document.getElementsByName(i.name).forEach(x => { x.checked = a.indexOf(x.value) >= 0; });
    }
    setVal(i, a);
  } else setVal(i, i.value);
}
function fieldByName(name) {
  const F = S.form, m = /^r(\d+)__(.+)$/.exec(name);
  const fields = currentStep().fields;
  if (m) { const rep = fields.filter(f => f.t === 'repeat')[0]; return rep.fields.filter(f => f.id === m[2])[0]; }
  return fields.filter(f => f.id === name)[0];
}
function setVal(i, val) {
  const F = S.form, m = /^r(\d+)__(.+)$/.exec(i.name);
  const fld = fieldByName(i.name);
  const out = fld && fld.t === 'number' && val !== '' ? Number(val) : val;
  if (m) { F.v.rehosp_lignes[+m[1]][m[2]] = out; if (out === '') delete F.v.rehosp_lignes[+m[1]][m[2]]; }
  else { if (empty_(out)) delete F.v[i.name]; else F.v[i.name] = out; }
  F.dirty = true;
  refresh();
}

/** Met à jour l'écran sans le reconstruire : le curseur reste dans le champ en cours. */
function refresh() {
  const F = S.form, steps = stepsOf(F), step = steps[F.step];
  compute_(F.kind, F.v, F.ctx);
  const miss = missing_(F.def, F.v, F.ctx);
  document.getElementById('st').innerHTML = steps.map((s, i) => {
    const bad = s === RECAP ? miss.length : miss.filter(m => m.step === s.id).length;
    return `<button type="button" data-go="${i}" class="${bad ? '' : 'done'}" ${i === F.step ? 'aria-current="step"' : ''}><i></i>${esc(s.short)}</button>`;
  }).join('');
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(Number(b.dataset.go)));
  const xs = crossChecks_(F.kind, F.v, F.ctx);
  step.fields.forEach(f => {
    if (!f.id || f.hidden) return;
    const box = document.querySelector(`[data-f="${f.id}"]`);
    if (!box) return;
    box.hidden = !cond_(f.show, F.v);
    if (f.t === 'calc') {
      const c = box.querySelector('[data-calc]'), x = F.v[f.id];
      c.className = 'calc' + (empty_(x) ? ' none' : '');
      c.textContent = empty_(x) ? 'Calculé automatiquement' : String(x).replace('.', ',') + (f.unit ? ' ' + f.unit : '');
    }
    const msg = box.hidden ? '' : (fieldError_(f, F.v[f.id]) || xs.filter(c => c.id === f.id).map(c => c.msg).join(' '));
    const er = box.querySelector(`[data-err="${f.id}"]`);
    if (er) { er.textContent = msg; er.hidden = !msg; }
  });
  document.querySelectorAll('.reh .q').forEach(q => {
    const m = /^r(\d+)__(.+)$/.exec(q.dataset.f); if (!m) return;
    const rep = step.fields.filter(f => f.t === 'repeat')[0];
    const sf = rep.fields.filter(f => f.id === m[2])[0], r = F.v.rehosp_lignes[+m[1]];
    q.hidden = !cond_(sf.show, r);
  });
  const blk = document.getElementById('blocker');
  blk.innerHTML = step.id === 'elig' ? eligMessage() : '';
  document.getElementById('fs').textContent = F.dirty ? 'Non enregistré' : (F.id ? 'Enregistré' : '');
  if (step === RECAP) renderRecap(miss);
  /* Garde la saisie sur le téléphone dès qu'une réponse change. */
  const cur = JSON.stringify(F.v);
  if (F.base === undefined) F.base = cur;
  else if (F.dirty && cur !== F.base) drafts.put(F);
}
function canSaveNow(F) {
  if (F.kind === 'suivi') return !(empty_(F.v.visite) || empty_(F.v.date_visite));
  return !!F.id || (!empty_(F.v.nom) && !empty_(F.v.n_dossier) && !eligFail().length);
}
/* Le réseau revient : on enregistre la fiche en cours sans attendre. */
window.addEventListener('online', () => {
  const F = S.form;
  if (F && F.dirty && canSaveNow(F) && document.getElementById('fs')) { toast('Réseau revenu : enregistrement…'); save().then(ok => { if (ok && S.form === F) refresh(); }); }
});
function eligMessage() {
  const bad = eligFail();
  return bad.length ? `<div class="block">Ce patient ne peut pas être inclus : ${esc(bad.join(' ; '))}.</div>` : '';
}
function eligFail() {
  const F = S.form, s = F.def.steps[0];
  return s.fields.filter(f => f.expect && !empty_(F.v[f.id]) && F.v[f.id] !== f.expect).map(f => `${f.label} = ${F.v[f.id]}`);
}
function renderRepeat() {
  const F = S.form, rep = currentStep().fields.filter(f => f.t === 'repeat')[0];
  F.v.rehosp_lignes = F.v.rehosp_lignes || [];
  const box = document.querySelector('[data-repeat]');
  box.innerHTML = F.v.rehosp_lignes.map((r, i) => `<section class="reh"><header><b>Hospitalisation ${i + 1}</b><button type="button" class="link" data-del="${i}">Retirer</button></header>
    ${rep.fields.map(sf => fieldHtml(sf, r, `r${i}__`)).join('')}</section>`).join('')
    + `<button type="button" class="btn" id="addr">Ajouter une hospitalisation</button>`;
  document.getElementById('addr').onclick = () => { F.v.rehosp_lignes.push({}); F.dirty = true; renderRepeat(); refresh(); };
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { F.v.rehosp_lignes.splice(Number(b.dataset.del), 1); F.dirty = true; renderRepeat(); refresh(); });
}
/* ---------- Protocole opératoire rédigé à partir de la fiche ---------- */
const PROTO_REQ = [['date_interv', 'date de l\'intervention'], ['type_arthro', 'type d\'arthroplastie'], ['voie', 'voie d\'abord'], ['tige_fix', 'fixation de la tige']];
function protoMissing(v) { return PROTO_REQ.filter(x => empty_(v[x[0]])).map(x => x[1]); }
function protocole(v, id) {
  const n = x => String(x).replace('.', ',');
  const L = [], P = (...a) => { const s = a.filter(Boolean).join(' ').replace(/\s+([.,])/g, '$1').trim(); if (s) L.push(s); };
  const pth = v.groupe_arthro === 'PTH', dm = v.type_arthro === 'PTH, double mobilité';
  const cote = v.cote ? v.cote.toLowerCase() : '';
  P('PROTOCOLE OPÉRATOIRE');
  P(STUDY.service);
  L.push('');
  P('Patient :', v.nom || '', v.age ? `, ${v.age} ans` : '', v.sexe ? `, ${v.sexe.toLowerCase()}` : '', '.', v.n_dossier ? `Dossier n° ${v.n_dossier}.` : '', id ? `Étude : ${id}.` : '');
  P('Date :', frDate(v.date_interv), v.heure_incision ? `, incision à ${v.heure_incision.replace(':', 'h')}` : '', '.', v.duree_min ? `Durée : ${v.duree_min} min.` : '');
  P('Opérateur :', v.operateur ? v.operateur.toLowerCase() + '.' : '', S.resident ? `Rédigé par : ${S.resident}.` : '');
  P('Anesthésie :', v.anesthesie ? v.anesthesie.toLowerCase() + '.' : '');
  L.push('');
  P('Indication : fracture du col fémoral', cote, v.garden ? `Garden ${v.garden}` : '', v.mecanisme ? `(${v.mecanisme.toLowerCase()})` : '', v.date_chute ? `, survenue le ${frDate(v.date_chute)}` : '', typeof v.delai_h === 'number' ? `, opérée à ${Math.round(v.delai_h)} h de la chute` : (typeof v.delai_j === 'number' ? `, opérée à J${v.delai_j}` : ''), '.');
  P(v.type_arthro ? `Geste : ${pth ? 'prothèse totale de hanche' + (dm ? ' à double mobilité' : '') : v.type_arthro.indexOf('Hémi') === 0 ? 'hémiarthroplastie ' + (v.type_arthro.indexOf('bipolaire') > 0 ? 'bipolaire' : 'unipolaire modulaire') : 'prothèse monobloc de ' + (v.type_arthro.split(': ')[1] || '').replace('autre', v.type_txt || 'autre type')}${v.fixation ? ', ' + v.fixation.toLowerCase() : ''}.` : '');
  L.push('');
  const inst = { 'Antérieure (Hueter)': 'décubitus dorsal.', 'Postérieure (Moore)': 'décubitus latéral, appuis pubien et sacré.' }[v.voie] || (v.voie ? 'décubitus latéral.' : '');
  P('Installation :', inst, 'Badigeonnage et champage stériles. Antibioprophylaxie selon le protocole du service.', v.txa === 'Oui' ? 'Acide tranexamique administré.' : '');
  const voie = {
    'Antérieure (Hueter)': 'Voie antérieure de Hueter, entre le tenseur du fascia lata et le sartorius.',
    'Antérolatérale (Watson-Jones)': 'Voie antérolatérale de Watson-Jones, entre le tenseur du fascia lata et le moyen fessier.',
    'Latérale directe (Hardinge)': 'Voie latérale directe de Hardinge, désinsertion antérieure du moyen fessier et du vaste latéral.',
    'Postérieure (Moore)': 'Voie postérolatérale de Moore, section des pelvitrochantériens.',
    'Autre': 'Voie d\'abord : à préciser.'
  }[v.voie];
  P(voie, v.voie ? 'Capsulotomie.' : '');
  P(v.voie ? 'Ostéotomie du col fémoral et extraction de la tête' : '', v.diam_tete_patient ? `(diamètre mesuré : ${v.diam_tete_patient} mm)` : '', v.voie ? '.' : '');
  if (pth) P('Préparation du cotyle par fraisages successifs. Mise en place d\'un cotyle', dm ? 'à double mobilité' : '', v.cotyle_fix ? (v.cotyle_fix === 'Cimenté' ? 'cimenté' : 'sans ciment') : '', v.taille_cotyle ? `de ${v.taille_cotyle} mm` : '', '.');
  P(v.tige_fix ? 'Préparation du fémur aux râpes. Mise en place d\'une tige' : '', v.tige_fix ? (v.tige_fix === 'Cimentée' ? 'cimentée' : 'sans ciment') : '', v.taille_tige ? `taille ${v.taille_tige}` : '', v.tige_fix ? '.' : '');
  if (pth) P(v.tete_pth ? `Tête de ${n(v.tete_pth)} mm` : '', v.col_long ? `, col ${v.col_long.toLowerCase()}` : '', dm && v.tete_pth ? ', dans un insert double mobilité' : '', v.tete_pth ? '.' : '');
  else if (v.tete_hemi) P(`Tête ${v.type_arthro && v.type_arthro.indexOf('bipolaire') > 0 ? 'bipolaire ' : ''}de ${v.tete_hemi} mm.`);
  P(v.implant ? `Implants : ${v.implant}.` : '');
  P(v.type_arthro ? 'Réduction. Contrôle de la stabilité et de la longueur du membre.' : '');
  if (v.bcis && v.bcis !== 'Grade 0') P(`Syndrome d'implantation du ciment, ${v.bcis.toLowerCase()}.`);
  const cp = { fx_fem: 'fracture fémorale', fx_cot: 'fracture du cotyle', vn: 'lésion vasculo-nerveuse', acr: 'arrêt cardiaque', autre: 'autre (à préciser)' };
  const comp = (v.comp_perop || []).filter(k => k !== 'aucune').map(k => cp[k]);
  P(comp.length ? `Complication peropératoire : ${comp.join(', ')}.` : (v.comp_perop ? 'Pas de complication peropératoire.' : ''));
  P(v.saignement !== undefined && v.saignement !== '' ? `Saignement estimé : ${v.saignement} mL.` : '');
  P(v.type_arthro ? 'Lavage. Fermeture plan par plan. Pansement.' : '');
  L.push('');
  P('Consignes postopératoires :', v.appui ? `appui ${v.appui.toLowerCase()}` : 'appui selon avis', v.lever_j !== undefined && v.lever_j !== '' ? `, lever à J${v.lever_j}` : '', '. Thromboprophylaxie selon le protocole du service. Radiographie de contrôle : bassin de face et hanche de profil.');
  return L.join('\n').replace(/\n{3,}/g, '\n\n');
}
function protoHtml(v, id) {
  const miss = protoMissing(v);
  if (miss.length) return `<div class="proto"><h3>Protocole opératoire</h3><p class="note">Votre protocole opératoire sera rédigé automatiquement dès que vous aurez renseigné : ${esc(miss.join(', '))}.</p></div>`;
  return `<div class="proto"><h3>Votre protocole opératoire est prêt</h3>
    <p class="note">Rédigé à partir de la fiche. Relisez-le et adaptez-le si besoin avant de le copier dans le dossier.</p>
    <textarea id="protoTxt" aria-label="Protocole opératoire" spellcheck="true">${esc(protocole(v, id))}</textarea>
    <div class="uplrow"><button type="button" class="btn pri" id="protoCopy">Copier le protocole</button>
    ${navigator.share ? '<button type="button" class="btn" id="protoShare">Partager</button>' : ''}
    <button type="button" class="btn" id="protoPrint">Imprimer</button></div></div>`;
}
function bindProto() {
  const t = document.getElementById('protoTxt'); if (!t) return;
  t.style.height = Math.min(900, t.scrollHeight + 4) + 'px';
  document.getElementById('protoCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
    toast('Protocole copié : collez-le dans le dossier du patient.');
  };
  const sh = document.getElementById('protoShare');
  if (sh) sh.onclick = () => navigator.share({ title: 'Protocole opératoire', text: t.value }).catch(() => {});
  document.getElementById('protoPrint').onclick = () => {
    const w = window.open('', '_blank');
    if (!w) { toast('Autorisez les fenêtres pour imprimer, ou utilisez « Copier ».', true); return; }
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Protocole opératoire</title><style>body{font:15px/1.6 Georgia,serif;max-width:720px;margin:32px auto;padding:0 16px;white-space:pre-wrap}</style>${esc(t.value)}`);
    w.document.close(); w.focus(); w.print();
  };
}
async function viewProtocol(id) {
  loading('Rédaction du protocole…');
  try {
    if (!S.patient || S.patient.id !== id) S.patient = await api('getPatient', id);
    const v = Object.assign({}, S.patient.values); compute_('inclusion', v, { today: today() });
    $app.innerHTML = topBar() + `<main class="wrap"><button class="link back" onclick="viewPatient('${esc(id)}')">Retour au patient</button>${protoHtml(v, id)}</main>`;
    bindProto(); window.scrollTo(0, 0);
  } catch (e) { fail(e); }
}

function renderRecap(miss) {
  const F = S.form, steps = stepsOf(F);
  const box = document.getElementById('recap');
  const proto = F.kind === 'inclusion' ? protoHtml(F.v, F.id) : '';
  if (!miss.length) { box.innerHTML = '<div class="ban ok">La fiche est complète.</div>' + proto; bindProto(); return; }
  box.innerHTML = `<div class="ban warn">${miss.length} élément${miss.length > 1 ? 's' : ''} à compléter. Vous pouvez terminer maintenant et revenir plus tard : la fiche restera dans « Fiches à compléter ».</div>${proto}
    <h3 style="margin-top:18px">À compléter</h3>
    <div class="list">${miss.map(m => {
      const idx = steps.findIndex(s => s.id === m.step);
      return `<button class="item" data-jump="${idx}"><span><strong>${esc(m.label)}</strong><small>${esc(steps[idx] ? steps[idx].short : '')} : ${esc(m.msg)}</small></span></button>`;
    }).join('')}</div>`;
  box.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => go(Number(b.dataset.jump)));
  bindProto();
}

/* ---------- Navigation et enregistrement ---------- */
function stepBlocked(step, forward) {
  const F = S.form;
  if (step === RECAP) return '';
  const bad = step.fields.filter(f => f.id && cond_(f.show, F.v) && fieldError_(f, F.v[f.id]));
  if (bad.length) return `Corrigez d'abord : ${bad[0].label}.`;
  if (F.kind === 'inclusion' && F.isNew && !F.id && forward) {
    if (step.id === 'elig') {
      if (step.fields.some(f => f.expect && empty_(F.v[f.id]))) return 'Répondez aux 5 critères pour continuer.';
      if (eligFail().length) return 'Ce patient ne remplit pas les critères : le dossier ne peut pas être créé.';
    }
    if (step.id === 'identite' && (empty_(F.v.nom) || empty_(F.v.n_dossier))) return 'Le nom et le N° de dossier sont nécessaires pour créer le dossier.';
  }
  if (F.kind === 'suivi' && step.id === 'visite' && (empty_(F.v.visite) || empty_(F.v.date_visite))) return 'Indiquez la visite et sa date.';
  return '';
}
async function go(target) {
  const F = S.form, steps = stepsOf(F), step = steps[F.step];
  const forward = target > F.step;
  if (forward && F.isNew && !F.id) {
    /* Avant la création du dossier, on ne saute pas d'étape. */
    if (F.kind === 'inclusion' && target > 1 && F.step < 1) target = 1;
  }
  const b = stepBlocked(step, forward);
  if (b && (forward || step.fields.some(f => f.id && cond_(f.show, F.v) && fieldError_(f, F.v[f.id])))) { toast(b, true); return; }
  const canSave = F.kind === 'suivi' ? !(empty_(F.v.visite) || empty_(F.v.date_visite)) : (F.id || step.id === 'identite');
  if (F.dirty && canSave) { const ok = await save(); if (!ok) return; }
  F.step = target;
  renderForm();
}
async function save(force) {
  const F = S.form;
  const fs = document.getElementById('fs'), bn = document.getElementById('bn');
  if (fs) fs.textContent = 'Enregistrement…';
  if (bn) bn.disabled = true;
  const k0 = drafts.key(F);
  try {
    let r;
    if (F.kind === 'inclusion') r = await api('savePatient', F.id, JSON.parse(JSON.stringify(F.v)), F.version, !!force);
    else r = await api('saveVisit', F.id, F.visiteId, JSON.parse(JSON.stringify(F.v)), F.version);
    if (r.duplicate) {
      const a = await dialog(`<p>Le N° de dossier ${esc(F.v.n_dossier)} existe déjà : <b>${esc(r.nom)}</b> (${esc(r.duplicate)}). S'agit-il de l'autre hanche du même patient ?</p>`, [{ l: 'Corriger le numéro' }, { l: 'Oui, nouvelle inclusion', pri: 1 }]);
      return a.i === 1 ? save(true) : false;
    }
    if (r.exists) {
      const a = await dialog(`<p>La visite « ${esc(F.v.visite)} » existe déjà pour ce patient.</p>`, [{ l: 'Rester ici' }, { l: 'Ouvrir la visite existante', pri: 1 }]);
      if (a.i === 1) { F.dirty = false; openVisit(F.id, r.exists); }
      return false;
    }
    if (r.conflict) {
      await dialog(`<p>${esc(r.by)} a modifié cette fiche pendant votre saisie. Rouvrez-la pour voir la dernière version : vos dernières modifications n'ont pas été enregistrées.</p>`, [{ l: 'Compris', pri: 1 }]);
      drafts.del(k0);
      if (F.kind === 'inclusion') { F.dirty = false; openInclusion(F.id); } else { F.dirty = false; openVisit(F.id, F.visiteId); }
      return false;
    }
    if (F.kind === 'inclusion') { const was = F.id; F.id = r.id; if (!was) toast('Dossier créé : ' + r.id); else toast('Enregistré'); }
    else { F.visiteId = r.visite_id; toast('Enregistré'); }
    F.version = r.version; F.v = r.values; F.dirty = false; F.isNew = false;
    drafts.del(k0); F.base = JSON.stringify(F.v);
    return true;
  } catch (e) {
    const offline = e && e.message === NET_ERR;
    if (F.dirty) drafts.put(F);
    toast(offline ? 'Pas de réseau : votre saisie est gardée sur ce téléphone. Elle sera enregistrée dès que le réseau revient.'
      : 'Non enregistré : ' + (e.message || 'vérifiez la connexion') + '. Votre saisie reste à l\'écran, réessayez.', true);
    if (fs) fs.textContent = 'Non enregistré';
    return false;
  } finally { if (bn) bn.disabled = false; }
}
async function finish() {
  const F = S.form;
  if (F.dirty) { const ok = await save(); if (!ok) return; }
  const id = F.id; S.form = null;
  viewPatient(id);
}
async function quitForm() {
  const F = S.form;
  if (F.dirty) {
    const canSave = F.kind === 'suivi' ? !(empty_(F.v.visite) || empty_(F.v.date_visite)) : !!F.id;
    if (canSave) {
      const a = await dialog('<p>Enregistrer vos dernières saisies avant de quitter ?</p>', [{ l: 'Quitter sans enregistrer' }, { l: 'Enregistrer et quitter', pri: 1 }]);
      if (a.i === 1) { const ok = await save(); if (!ok) return; }
    } else {
      const a = await dialog('<p>Ce dossier n\'a pas encore été créé : les réponses saisies seront perdues.</p>', [{ l: 'Continuer la saisie' }, { l: 'Quitter', pri: 1 }]);
      if (a.i === 0) return;
    }
  }
  if (F.dirty) drafts.del(drafts.key(F));
  const id = F.id; S.form = null;
  if (id) viewPatient(id); else viewHome();
}
window.addEventListener('beforeunload', e => { if (S.form && S.form.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Démarrage ---------- */
(function () {
  S.token = store.get('tok'); S.resident = store.get('res');
  if (!S.token) { viewLogin(); return; }
  loading('Chargement des patients…');
  rawCall('getHome', [S.token])
    .then(h => { S.home = h; S.resident = h.resident; renderHome(); })
    .catch(e => {
      if (String(e && e.message).indexOf('SESSION_EXPIRED') >= 0) { store.del('tok'); store.del('res'); S.token = null; viewLogin(); }
      else fail(e);
    });
})();
</script>
